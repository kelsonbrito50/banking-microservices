server:
  port: 8081
  error:
    include-message: always
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: bank
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: ${JWT_SECRET}
  access-ttl-minutes: 15
