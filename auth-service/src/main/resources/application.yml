server:
  port: 8081
  # Loopback by default; Docker sets BIND_ADDRESS=0.0.0.0 (see account-service).
  address: ${BIND_ADDRESS:127.0.0.1}
  error:
    include-message: always
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: bank
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
jwt:
  secret: ${JWT_SECRET}
  access-ttl-minutes: 15
