server:
  port: 8083
  error:
    include-message: always
spring:
  application:
    name: transaction-service
  # Calls to account-service: a hung service fails fast instead of holding the
  # transfer thread forever. A timeout counts as "outcome unknown" in the saga.
  http:
    client:
      connect-timeout: 2s
      read-timeout: 5s
  datasource:
    url: jdbc:postgresql://localhost:5435/transaction_db
    username: bank
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
services:
  account-url: ${ACCOUNT_SERVICE_URL:http://localhost:8082}
