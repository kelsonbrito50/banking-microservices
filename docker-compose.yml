# Only infrastructure and the API gateway are exposed on the host. The backend
# services have no port mappings: all client traffic must pass through the
# gateway, so the X-User-* identity headers cannot be spoofed by calling a
# service directly. (For hybrid dev — infra in Docker, services via mvn — the
# infra ports below are all you need.)

x-jwt-secret: &jwt-secret ${JWT_SECRET:-change-me-in-production-min-32-chars-secret-key!!}

services:
  postgres-auth:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: auth_db, POSTGRES_USER: bank, POSTGRES_PASSWORD: bank }
    ports: ["5433:5432"]
  postgres-account:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: account_db, POSTGRES_USER: bank, POSTGRES_PASSWORD: bank }
    ports: ["5434:5432"]
  postgres-transaction:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: transaction_db, POSTGRES_USER: bank, POSTGRES_PASSWORD: bank }
    ports: ["5435:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  kafka:
    image: bitnamilegacy/kafka:3.7
    # Dual listeners: containers reach the broker at kafka:9092 (PLAINTEXT),
    # host processes at localhost:9092 (EXTERNAL, container port 9094).
    ports: ["9092:9094"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
  auth-service:
    build: ./auth-service
    depends_on: [postgres-auth]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
      JWT_SECRET: *jwt-secret
  account-service:
    build: ./account-service
    depends_on: [postgres-account, redis, kafka]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-account:5432/account_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  transaction-service:
    build: ./transaction-service
    depends_on: [postgres-transaction, kafka, account-service]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-transaction:5432/transaction_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8082
  notification-service:
    build: ./notification-service
    depends_on: [kafka]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    depends_on: [auth-service, account-service, transaction-service]
    environment:
      REDIS_HOST: redis
      AUTH_SERVICE_URL: http://auth-service:8081
      ACCOUNT_SERVICE_URL: http://account-service:8082
      TRANSACTION_SERVICE_URL: http://transaction-service:8083
      JWT_SECRET: *jwt-secret
